<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Cifras do ministério de louvor, com troca de tom, repertório dos cultos e modo ao vivo.">
<meta name="theme-color" content="#16171c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clave">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Clave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* direção: aurora fosca. grafite fosco, vidro escuro; o gradiente escolhido por cada um aparece nos destaques */
  --bg:#16171c; --surface:#1d1e24; --raise:#22232a; --ink:#f2f0f8; --muted:#9a9cab; --line:rgba(255,255,255,.07);
  --accent:#ec4899; --accent-ink:#ffffff; --honey:#f9a8d4; --soft:#2c2d35; --tint:#2a2b33; --live:#4ade80; --danger:#f87171;
  --grad:linear-gradient(120deg,#fb923c 0%,#ec4899 45%,#8b5cf6 80%,#6366f1 100%);
  --hl:inset 0 1px 0 rgba(255,255,255,.05);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -14px rgba(0,0,0,.7);
  --glass:rgba(29,30,36,.72);
  --f-display:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
:root{--st:calc(env(safe-area-inset-top) + 30px)}
html{min-height:calc(100% + env(safe-area-inset-top))}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;padding-top:var(--st);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--honey);outline-offset:2px}
svg.i{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
main{padding:22px 0 130px}
/* espaço no fim da lista para a última música passar da barra de baixo e do botão + (o iPhone come a altura do topo) */
body:not(.songmode) main#app{padding-bottom:calc(150px + env(safe-area-inset-bottom) + env(safe-area-inset-top))}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.025em;text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}

/* faixa ao vivo */
.livebar{position:sticky;top:var(--st);z-index:30;display:none;background:var(--live);color:#fff;font-size:14px}
.livebar.on{display:block}
.livebar .wrap{display:flex;align-items:center;gap:10px;min-height:44px;padding-top:6px;padding-bottom:6px}
.livebar .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite;flex:0 0 auto}
@keyframes pulse{50%{opacity:.3}}
.livebar .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.livebar button{border:1.5px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:999px;padding:5px 14px;font-weight:800;font-size:13px}
.livebar button[aria-pressed="true"]{background:#fff;color:var(--live)}

/* cabeçalho da home */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 18px}
.hello h1{font-size:34px;line-height:1.05}
.hello h1 em{font-style:normal;color:var(--accent)}
.search{display:flex;align-items:center;gap:10px;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:0 16px;box-shadow:var(--shadow);margin-bottom:20px}
.search svg{color:var(--muted)}
.search input[type=search]{flex:1;border:0;background:none;padding:13px 0;outline:none;min-width:0;box-shadow:none;border-radius:0}
.search:focus-within{border-color:var(--accent)}

/* cartão do próximo culto */
.next{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;border:0;border-radius:var(--r);padding:16px;margin-bottom:26px;
  background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.datebox{width:58px;height:62px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center;align-content:center;line-height:1}
.datebox b{font:700 26px var(--f-display)}
.datebox span{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.next .k{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
.next h3{font-size:20px;margin:2px 0}
.next p{margin:0;font-size:14px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next>div{min-width:0}

/* lista de músicas */
.group{margin-bottom:18px}
.letter{font:800 13px var(--f-body);color:var(--muted);letter-spacing:.08em;margin:0 0 8px 4px}
.cards{list-style:none;margin:0;padding:0;background:var(--raise);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.cards li+li{border-top:1px solid var(--line)}
.song{width:100%;display:flex;gap:14px;align-items:center;text-align:left;border:0;background:none;padding:12px 14px}
.song:hover{background:var(--tint)}
.keyb{flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--honey);font:800 18px var(--f-display)}
.song .t{font-weight:800;line-height:1.25}
.song .a{font-size:14px;color:var(--muted)}
.song>div{flex:1;min-width:0}
.song .chev{color:var(--muted)}
.capa{flex:0 0 auto;width:52px;height:52px;border-radius:13px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.capa i{position:absolute;border-radius:50%;opacity:.92}
.capa b{position:absolute;left:7px;bottom:5px;color:#fff;font:800 15px var(--f-display);letter-spacing:.02em;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.song .ktom{color:var(--honey);font-weight:800}
.estudo{margin:0 0 22px;background:var(--raise);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:var(--r);overflow:hidden}
.esthead{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border:0;background:none;color:var(--ink);font-weight:800;font-size:16px}
.esthead>span{display:flex;align-items:center;gap:8px}.esthead svg{width:20px;height:20px;color:var(--honey)}
.esthead .cnt{font-style:normal;font-size:12px;background:var(--soft);color:var(--honey);border-radius:999px;padding:2px 8px}
.estudo .cards{border-radius:0;box-shadow:none;border:0;border-top:1px solid var(--line)}
.tag.semcifra{background:#3f3416;color:#fde68a}
.swfin{background:#16a34a}.swest{background:#4a4b55}
.song .fone{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--honey);margin-left:auto}
.song .fone svg{width:20px;height:20px}
.refs{display:grid;gap:8px}
.ref{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--soft);border:0;color:var(--ink);font-weight:700;text-decoration:none;text-align:left;width:100%}
.ref svg{width:18px;height:18px;color:var(--honey);flex:0 0 auto}
#mini{position:fixed;z-index:20;border-radius:12px;overflow:hidden;background:#000;visibility:hidden}
#mini iframe{display:block;width:100%;height:100%;border:0}
.vslot{margin:-4px 0 16px}
.vslot .vh{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-family:var(--sans,inherit)}
.vslot .vh>svg{width:16px;height:16px;color:var(--accent);flex:0 0 auto}
.vslot .vh b{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vslot .vh .icon{width:30px;height:30px;flex:0 0 auto}
.vslot .vv{height:200px;min-width:200px;border-radius:12px;background:#000}
.empty{text-align:center;padding:36px 18px;color:var(--muted);background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r)}
.note{background:var(--soft);border-radius:14px;padding:11px 15px;font-size:14px;margin:0 0 16px}
.note.err{background:color-mix(in srgb,var(--danger) 15%,var(--surface))}

/* botões */
.btn{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:10px 18px;font-weight:800;font-size:15px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.live{background:var(--live);border-color:var(--live);color:#fff}
.btn.save{background:var(--live);border-color:var(--live);color:#fff;font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--live);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.4);display:flex;gap:8px;align-items:center;white-space:nowrap;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.toast .i{width:18px;height:18px}
.btn:disabled{opacity:.4;cursor:default}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);padding:4px 0;font-weight:700;font-size:15px;margin-bottom:12px}
.fab{color:#fff!important;position:fixed;right:max(18px,calc(50% - 362px));bottom:96px;z-index:16;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:26px;height:26px;stroke-width:2.2}

/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.tabbar::after,.dock::after{content:'';position:absolute;left:0;right:0;top:100%;height:env(safe-area-inset-top);background:var(--surface)}
body.stage .dock::after{display:none}
.tabbar .wrap{display:flex;justify-content:center;gap:8px;padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;max-width:180px;border:0;background:none;border-radius:16px;padding:7px 0 6px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--accent);background:var(--tint)}
.tabbar svg{width:24px;height:24px}

/* tela da música */
.songhead{margin-bottom:16px}
.songhead h1{font-size:32px;line-height:1.08}
.songhead p{margin:6px 0 0;color:var(--muted);font-size:15px}
.tonecard{display:flex;align-items:center;gap:14px;background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:16px}
.tone{border:0;background:none;padding:0;display:flex;align-items:baseline;gap:10px;text-align:left;flex:1;min-width:0}
.tone .big{font:800 44px/1 var(--f-display);letter-spacing:-.03em;color:var(--honey);min-width:1.4em}
.tone small{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tone span.s{font-size:14px;color:var(--muted);line-height:1.3}
.stepper{display:flex;gap:6px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:700 18px var(--f-body);display:grid;place-items:center}
.ctl{position:relative;background:var(--raise);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 12px 22px;margin-bottom:14px;display:grid;gap:10px;justify-items:center}
.ctl.enter{animation:ctlin .32s cubic-bezier(.2,.9,.25,1)}
@keyframes ctlin{from{opacity:0;transform:translateY(-8px) scale(.98)}}
.ctl-r1{display:flex;align-items:center;justify-content:center;gap:14px}
.ctl-r2{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.kbig{border:0;background:none;padding:0 6px;font:800 46px/1 var(--f-display);letter-spacing:-.035em;color:var(--honey);min-width:76px;text-align:center}
.kbig.solo{display:block;margin:0 auto 4px}
.tile{width:50px;height:48px;border-radius:15px;border:0;background:var(--tint);color:var(--ink);display:grid;place-items:center}
.tile svg{width:22px;height:22px;stroke-width:2.2}
.tile:active,.chip2:active,.fpill button:active{transform:scale(.95)}
.fpill{display:inline-flex;background:var(--tint);border-radius:999px;padding:3px}
.fpill button{border:0;background:none;width:38px;height:32px;border-radius:999px;font-weight:800;color:var(--ink);display:grid;place-items:center}
.fpill button:hover{background:var(--raise)}
.chip2{position:relative;border:0;background:var(--tint);color:var(--ink);border-radius:999px;height:38px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.chip2 svg{width:17px;height:17px}
.chip2 .g{font-size:12px;font-weight:800;letter-spacing:.02em}
.chip2.icon-only{padding:0 12px}
.chip2[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip2 .badge{position:absolute;top:-5px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font:800 11px/18px var(--f-body);font-style:normal;padding:0 4px;border:2px solid var(--raise);box-sizing:content-box}
.ctl-info{margin:0;font-size:13px;color:var(--muted)}
.ctl-tog{position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);width:44px;height:28px;border-radius:999px;border:1px solid var(--line);background:var(--raise);display:grid;place-items:center;color:var(--muted);box-shadow:var(--shadow)}
.ctl-tog svg{width:18px;height:18px}
.ctl-tog.solo{position:static;transform:none;margin:8px auto 0}
.titlebox{text-align:center;margin:22px 0 16px}
.titlebox h1{font-size:28px;line-height:1.1}
.titlebox p{margin:6px 0 0;color:var(--muted);font-size:14px}
.songmode main#app{position:fixed;top:calc(var(--top,0px) + env(safe-area-inset-top) + 14px);bottom:var(--bot,80px);left:0;right:0;margin:0 auto;padding-top:14px;padding-bottom:12px;display:flex;flex-direction:column;overflow:hidden}
.songmode main#app>*{flex:0 0 auto}
.songmode main#app>.back{align-self:flex-start;margin-bottom:8px}
.songmode main#app>.sheetbox{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.songmode .titlebox{margin:20px 0 12px}
.dock .mid{align-items:center}
[data-act=scroll]{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[data-act=scroll].holding{transform:scale(1.06);background:var(--grad);color:#fff}
.speedpop{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px) scale(.96);opacity:0;pointer-events:none;z-index:60;width:min(300px,86vw);background:rgba(29,30,36,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:20px;padding:14px 16px;box-shadow:0 18px 40px -12px rgba(0,0,0,.8),var(--hl);transition:opacity .15s,transform .15s}
.speedpop.on{opacity:1;transform:translate(-50%,0) scale(1)}
.sp-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:14px;color:var(--muted)}
.sp-top b{font-size:30px;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-bar{position:relative;height:8px;border-radius:9px;background:var(--soft);margin:12px 0 8px}
.sp-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--grad)}
.sp-bar em{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.5)}
.sp-hint{font-size:12px;color:var(--muted);text-align:center}
.swipe{position:relative;overflow:hidden}
.cultos .swipe{border-radius:var(--r)}
.cultos.tlist{gap:0}
.tl{display:flex;gap:12px}
.tl .rail{width:14px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center}
.tl .rail i{width:12px;height:12px;border-radius:50%;border:2px solid var(--muted);background:var(--bg);margin-top:24px;flex:0 0 auto}
.tl .rail::after{content:'';flex:1;width:2px;background:var(--line);margin-top:4px}
.tl:last-child .rail::after{background:linear-gradient(var(--line),transparent)}
.tl.on .rail i{border:0;background:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 28%,transparent)}
.tl.on .rail::after{background:linear-gradient(var(--accent),var(--line))}
.tl.soon .rail i{border-color:var(--accent)}
.tl.old .rail i{border-color:var(--line)}
.tl .tlc{flex:1;min-width:0;margin-bottom:12px;border-radius:var(--r)}
.tl .when{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--honey);margin-bottom:2px}
.tl .culto.next .when{color:#fff}
.tl.old .when{color:var(--muted)}
.tl .culto>div{flex:1;min-width:0}.tl .culto .chev{flex:0 0 auto}
.tl .culto.past{opacity:1}.tl.old .culto>*{opacity:.6}
.cultos,.cards,.list,.items{grid-template-columns:minmax(0,1fr)}
.cultos>li,.cards>li{min-width:0}
html,body{overflow-x:hidden;max-width:100%;touch-action:pan-x pan-y}
button,a,input,select,textarea,label{touch-action:manipulation}
.sheetbox{touch-action:pan-y}
.swdel{position:absolute;top:0;right:0;bottom:0;width:92px;border:0;background:var(--danger);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;align-content:center;gap:2px}
.swdel svg{width:20px;height:20px}
.swipe>.song,.swipe>.culto{position:relative;background:var(--raise);transition:transform .22s cubic-bezier(.2,.9,.25,1);touch-action:pan-y}
.swipe>.open{transform:translateX(calc(-1 * var(--sw,92px)))}
.swacts{position:absolute;top:0;right:0;bottom:0;display:flex}
.swacts>button{position:static;width:92px;border:0;color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;align-content:center;gap:2px}
.swfav{background:var(--accent)}.swfav.on{background:#4a4b55}.swacts svg{width:20px;height:20px}
.i.fill path{fill:currentColor}
.favmark{display:inline-grid;margin-left:6px;vertical-align:-2px;color:var(--honey)}.favmark svg{width:14px;height:14px}
.searchrow{display:flex;gap:10px;align-items:center;margin-bottom:20px}.searchrow .search{flex:1;min-width:0;margin-bottom:0}
.favtog{width:50px;height:50px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);background:var(--soft);box-shadow:var(--hl);display:grid;place-items:center;color:var(--muted)}
.favtog[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent}
.tag.novo{background:var(--grad);color:#fff}
.tabic{position:relative;display:inline-grid}
.tabic .badge{position:absolute;top:-4px;right:-10px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font:800 10px/16px var(--f-body);font-style:normal;padding:0 4px}
.nav.full{width:46px;height:46px}
body.stage #livebar,body.stage .songmode main#app>.back{display:none!important}
body.stage main#app>.back,body.stage main#app>.ctl,body.stage main#app>.titlebox,body.stage main#app>.note,body.stage .upnext,body.stage .dock .ctl,body.stage .dock .nav:not(.full):not(.sol){display:none!important}
body.stage.songmode main#app{top:calc(env(safe-area-inset-top) + 14px);padding-top:8px;max-width:none}
body.stage .sheetbox{border-radius:14px;padding-bottom:96px}
body.stage.songmode main#app{bottom:0!important}
body.stage .dock{background:transparent;border-top:0;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none}
body.stage .dock .wrap>div{justify-content:center}
body.stage .dock button{pointer-events:auto;box-shadow:0 8px 24px -8px rgba(0,0,0,.7)}
.dock.low .ctl{margin:0 0 10px;box-shadow:none;background:var(--surface)}
.dock.low .ctl-tog{bottom:auto;top:-15px}
.dock.low .ctl-tog svg{transform:rotate(180deg)}

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gradStroke" x1="0" y1="0" x2="1" y2="1"><stop id="gs1" offset="0" stop-color="#fb923c"/><stop id="gs2" offset="1" stop-color="#8b5cf6"/></linearGradient></defs></svg>

<script>

/* ================= Teoria musical ================= */
const IDX={C:0,'B#':0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,Fb:4,'E#':5,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11};
const SP={
  sharp:['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],
  flat:['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'],
  mixed:['C','C#','D','Eb','E','F','F#','G','G#','A','Bb','B'],
  g:['C','C#','D','D#','E','F','F#','G','G#','A','Bb','B']
};
const KEY_LABELS=['C','C#/Db','D','D#/Eb','E','F','F#/Gb','G','G#/Ab','A','A#/Bb','B'];
const mod=n=>((n%12)+12)%12;
function parseKey(k){
  const m=/^([A-G])([#b]?)(m?)/.exec(String(k||'C').trim());
  if(!m) return {idx:0,minor:false};
  return {idx:IDX[m[1]+m[2]],minor:m[3]==='m'};
}
function spellFor(idx,minor){
  if(P.acc==='sharp') return SP.sharp;
  if(P.acc==='flat') return SP.flat;
  const maj=minor?mod(idx+3):idx;
  if([1,3,5,8,10].includes(maj)) return SP.flat;
  if([2,4,6,9,11].includes(maj)) return SP.sharp;
  return maj===7?SP.g:SP.mixed;
}
function keyName(idx,minor){return spellFor(idx,minor)[mod(idx)]+(minor?'m':'')}
const SUF=/^(?:maj|min|dim|aug|sus|add|m|M|º|°|\+|-|\d|\(|\)|#|b|,|\.|\/)*$/;
const CH=/^([A-G])([#b]?)(.*?)(?:\/([A-G])([#b]?))?$/;
function parseChord(t){const m=CH.exec(t);if(!m||!SUF.test(m[3]))return null;return m}
function transChord(t,shift,spell){
  const m=parseChord(t); if(!m) return t;
  if(mod(shift)===0) return t;
  let out=spell[mod(IDX[m[1]+m[2]]+shift)]+m[3];
  if(m[4]) out+='/'+spell[mod(IDX[m[4]+m[5]]+shift)];
  return out;
}
const NEUTRAL=/^(\|+|x\d+|\d+x|-+|\.+|%|\/|:|→|>|\*+|\(|\))$/i;
function splitTok(t){const m=/^([(]*)(.*?)([)*,.]*)$/.exec(t);return m?[m[1],m[2],m[3]]:['',t,'']}
function isChordTok(t){return !!parseChord(splitTok(t)[1])}
function isChordLine(s){
  const toks=s.match(/\S+/g); if(!toks) return false;
  let n=0;
  for(const t of toks){
    if(isChordTok(t)) n++;
    else if(!(NEUTRAL.test(t)||/:$/.test(t))) return false;
  }
  return n>0;
}
/* recoloca os acordes nas mesmas colunas e devolve tokens com posições */
function layoutChordLine(s,shift,spell){
  const parts=[];let len=0;
  for(const m of s.matchAll(/\S+/g)){
    const [a,core,b]=splitTok(m[0]);
    const chord=!!parseChord(core);
    const text=chord?a+(DEG?toDegree(core,DEG):transChord(core,shift,spell))+b:m[0];
    const pos=parts.length?Math.max(m.index,len+1):m.index;
    parts.push({pos,text,chord});len=pos+text.length;
  }
  return parts;
}
function chordLineHTML(s,shift,spell){
  let html='',len=0;
  for(const p of layoutChordLine(s,shift,spell)){
    html+=' '.repeat(p.pos-len)+(p.chord?'<b>'+esc(p.text)+'</b>':esc(p.text));len=p.pos+p.text.length;
  }
  return html;
}
function inlineSplit(line){
  let chords='',lyr='',last=0;const re=/\[([^\]]+)\]/g;let m;
  while((m=re.exec(line))){
    lyr+=line.slice(last,m.index);last=re.lastIndex;
    if(chords.length&&lyr.length<chords.length+1) lyr+=' '.repeat(chords.length+1-lyr.length);
    chords=chords.padEnd(lyr.length)+m[1];
  }
  lyr+=line.slice(last);
  return [chords,lyr];
}
function classify(line){
  if(!line.trim()) return {type:'blank'};
  const sec=/^\s*\[([^\]]+)\]\s*(.*)$/.exec(line);
  if(sec&&!parseChord(sec[1].trim())) return {type:'section',label:sec[1].trim(),rest:sec[2]};
  if(isChordLine(line)) return {type:'chords'};
  const br=[...line.matchAll(/\[([^\]]+)\]/g)];
  if(br.length&&br.every(b=>parseChord(b[1].trim()))) return {type:'inline'};
  return {type:'lyric'};
}
const DEG_MAJ=['I','bII','II','bIII','III','IV','#IV','V','bVI','VI','bVII','VII'];
const DEG_MIN=['I','bII','II','III','#III','IV','#IV','V','VI','#VI','VII','#VII'];
let DEG=null;
function toDegree(t,key){
  const m=parseChord(t); if(!m) return t;
  const map=key.minor?DEG_MIN:DEG_MAJ;
  let out=map[mod(IDX[m[1]+m[2]]-key.idx)]+m[3];
  if(m[4]) out+='/'+map[mod(IDX[m[4]+m[5]]-key.idx)];
  return out;
}
/* campo harmônico do tom, para a paleta do editor */
function harmonicField(key){
  const sp=spellFor(key.idx,key.minor);
  const steps=key.minor?[[0,'m','Im'],[2,'m(b5)','IIø'],[3,'','III'],[5,'m','IVm'],[7,'m','Vm'],[7,'','V'],[8,'','VI'],[10,'','VII']]
                        :[[0,'','I'],[2,'m','IIm'],[4,'m','IIIm'],[5,'','IV'],[7,'','V'],[9,'m','VIm'],[11,'m(b5)','VIIø']];
  return steps.map(([s,q,d])=>({chord:sp[mod(key.idx+s)]+q,deg:d}));
}
function mkLyric(text,chords){
  const len=text.length,out=[],used=new Set();
  for(const c of chords){
    let p=Math.min(c.pos,len);
    while(p<len&&text[p]===' ')p++;
    while(p<len&&used.has(p)){p++;while(p<len&&text[p]===' ')p++}
    if(p<len)used.add(p);
    out.push({pos:p,ch:c.ch});
  }
  return {type:'lyric',text,chords:out.sort((a,b)=>a.pos-b.pos)};
}
function inlineToLyric(line){
  const chords=[];let txt='',last=0;
  for(const m of line.matchAll(/\[([^\]]+)\]/g)){txt+=line.slice(last,m.index);last=m.index+m[0].length;chords.push({pos:txt.length,ch:m[1].trim()})}
  txt+=line.slice(last);return mkLyric(txt,chords);
}
function mapTok(tok,shift,spell){const [a,core,b]=splitTok(tok);if(!parseChord(core))return tok;return a+(DEG?toDegree(core,DEG):transChord(core,shift,spell))+b}
/* letra com acordes: cada palavra carrega o próprio acorde, então ao quebrar a linha o acorde desce junto */
function segHTML(L,shift,spell){
  const t=L.text,len=t.length,C=L.chords;let html='';
  const lead=/^\s*/.exec(t)[0].length;
  for(const m of t.matchAll(/\S+/g)){
    const ws=m.index,we=ws+m[0].length;
    const cuts=[ws,...C.filter(c=>c.pos>ws&&c.pos<we).map(c=>c.pos),we];
    let pcs='';
    for(let k=0;k<cuts.length-1;k++){
      const ch=C.find(c=>c.pos===cuts[k]);
      pcs+=`<span class="sp"><b>${ch?esc(mapTok(ch.ch,shift,spell)):''}</b><span>${esc(t.slice(cuts[k],cuts[k+1]))}</span></span>`;
    }
    html+=`<span class="sw">${pcs}</span>`;
  }
  const ends=C.filter(c=>c.pos>=len);
  if(ends.length) html+=ends.map(c=>`<span class="sw"><span class="sp"><b>${esc(mapTok(c.ch,shift,spell))}</b><span>&nbsp;</span></span></span>`).join('');
  return `<div class="ln sg"${lead?` style="padding-left:${lead}ch"`:''}>${html}</div>`;
}
function renderSheet(text,shift,spell,lyricsOnly,degKey){
  DEG=degKey||null;
  const out=[];
  const push=(cls,html)=>out.push('<div class="ln'+(cls?' '+cls:'')+'">'+html+'</div>');
  const lines=String(text||'').replace(/\t/g,'    ').split(/\r?\n/).map(l=>l.replace(/\s+$/,''));
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    const c=classify(line);
    if(c.type==='blank'){ if(!(lyricsOnly&&out.length&&out[out.length-1]==='<div class="ln"></div>')) push('',''); continue }
    if(c.type==='section'){
      push('sec',esc(c.label));
      if(c.rest&&!lyricsOnly) push('c',isChordLine(c.rest)?chordLineHTML(c.rest,shift,spell):esc(c.rest));
      else if(c.rest&&!isChordLine(c.rest)) push('',esc(c.rest));
      continue;
    }
    if(c.type==='chords'){
      const nx=i+1<lines.length?lines[i+1]:'';
      if(nx&&classify(nx).type==='lyric'){
        i++;
        if(lyricsOnly){push('',esc(nx));continue}
        const L=mkLyric(nx,[...line.matchAll(/\S+/g)].filter(m=>isChordTok(m[0])).map(m=>({pos:m.index,ch:m[0]})));
        out.push(segHTML(L,shift,spell));continue;
      }
      if(!lyricsOnly) push('c',chordLineHTML(line,shift,spell));
      continue;
    }
    if(c.type==='inline'){
      const L=inlineToLyric(line);
      if(lyricsOnly){push('',esc(L.text));continue}
      out.push(segHTML(L,shift,spell));continue;
    }
    push('',esc(line));
  }
  return out.join('');
}


/* ================= Ícones ================= */
const I={

  cloudoff:'<path d="M3 3l18 18M8 7a5.5 5.5 0 0 1 9.6 3.2A4 4 0 0 1 20.5 17M17 19H7a4.5 4.5 0 0 1-1.6-8.7"/>', share:'<path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>', minus:'<path d="M5 12h14"/>',
  left:'<path d="m15 18-6-6 6-6"/>', right:'<path d="m9 18 6-6-6-6"/>',

};

/* cor personalizada: Cor 1 + Cor 2 formam o gradiente */
const hexRgb=h=>{h=String(h||'').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16)||0;return [n>>16&255,n>>8&255,n&255]};
const rgbHex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mixHex=(x,y,t)=>{const a=hexRgb(x),b=hexRgb(y);return rgbHex(a.map((v,i)=>v+(b[i]-v)*t))};
function temaCustom(){
  const c1=P.c1||'#22d3ee',c2=P.c2||'#a855f7';
  const sat=h=>{const v=hexRgb(h);return Math.max(...v)-Math.min(...v)};
  const main=sat(c2)>=sat(c1)?c2:c1;
  return {nome:'A minha',grad:`linear-gradient(120deg,${c1},${c2})`,a:main,c:mixHex(main,'#ffffff',.42),s:[c1,c2]};
}
function applyTema(){
  const t=P.tema==='custom'?temaCustom():(TEMAS[P.tema]||TEMAS.oceano),r=document.documentElement.style;
  r.setProperty('--grad',t.grad);r.setProperty('--s1',t.s[0]);r.setProperty('--s2',t.s[1]);r.setProperty('--accent',t.a);r.setProperty('--honey',t.c);r.setProperty('--chord-sol',mixHex(t.a,'#000000',.28));
  /* o iPhone não repinta o ícone quando só a cor do gradiente muda: cria um gradiente novo e troca a referência */
  const old=document.getElementById('gradStroke');if(old){const id='gs'+Date.now().toString(36);const g=old.cloneNode(true);g.id=id;
    g.children[0].setAttribute('stop-color',t.s[0]);g.children[1].setAttribute('stop-color',t.s[1]);
    const defs=old.parentNode;[...defs.querySelectorAll('linearGradient[id^="gs"]')].forEach(x=>x.remove());defs.appendChild(g);r.setProperty('--gstroke',`url(#${id})`)}
}

function subscribe(){
  unsubData();B.subscribed=true;
  const ff=B.ff,fs=B.fs;
  const fail=e=>{S.loaded=true;S.err=e&&e.code==='permission-denied'?'Seu acesso foi retirado. Fale com o responsável.':'Não consegui carregar as cifras agora.';render()};
  const ok=()=>{S.loaded=true;S.slow=false};
  B.unsubs.push(ff.onSnapshot(ff.collection(fs,'songs'),s=>{S.songs=new Map(s.docs.map(d=>[d.id,d.data()]));ok();onData()},fail));
  B.unsubs.push(ff.onSnapshot(ff.collection(fs,'cultos'),s=>{S.cultos=new Map(s.docs.map(d=>[d.id,d.data()]));ok();onData()},fail));
  if(S.uid)B.unsubs.push(ff.onSnapshot(ff.doc(fs,'favs',S.uid),s=>{if(s.metadata.hasPendingWrites)return;const ids=s.exists()?(s.data().ids||[]):store.get(favKey(),[]);S.favs=new Set(ids);store.set(favKey(),ids);if(S.view==='songs')renderList()},()=>{}));
  B.unsubs.push(ff.onSnapshot(ff.collection(fs,'sugestoes'),s=>{S.sug=s.docs.map(d=>({id:d.id,...d.data()}));sugMudou()},()=>{}));
  B.unsubs.push(ff.onSnapshot(ff.collection(fs,'fotos'),s=>{S.fotos=Object.fromEntries(s.docs.map(d=>[d.id,d.data().img||'']));fotosMudaram()},()=>{}));
  B.unsubs.push(ff.onSnapshot(ff.doc(fs,'live','atual'),s=>{
    const prev=S.live;S.live=s.exists()?s.data():null;
    if(S.broadcast&&S.live&&S.live.by&&S.live.by!==S.uid) S.broadcast=null;
    if(S.follow&&liveActive()&&(!prev||prev.at!==S.live.at)&&S.live.by!==S.uid) followLive();
    onData();
  },()=>{}));
}

function watchUser(u){
  (B.userUnsubs||[]).forEach(x=>{try{x()}catch{}});B.userUnsubs=[];
  const ff=B.ff,fs=B.fs,k='cifras:membro:'+u.uid;
  const cached=store.get(k,null);if(cached){setMember(cached);if(!B.subscribed)subscribe()}
  B.userUnsubs.push(ff.onSnapshot(ff.doc(fs,'membros',u.uid),s=>{
    const m=s.exists()?s.data():null;
    if(!m&&s.metadata.fromCache&&cached) return;
    store.set(k,m);setMember(m);S.authReady=true;
    if(m){if(!B.subscribed)subscribe();if(S.isDev)subscribePeople();else unsubPeople()}
    else{unsubData();unsubPeople();S.songs=new Map();S.cultos=new Map()}
    render();
  },()=>{S.authReady=true;render()}));
  B.userUnsubs.push(ff.onSnapshot(ff.doc(fs,'pedidos',u.uid),s=>{S.pedido=s.exists()?s.data():null;render()},()=>{}));
}

    const [fa,ff,au]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-firestore.js'),import(base+'firebase-auth.js')]);
    const app=fa.initializeApp(cfg);

      clearTimeout(timer);

        S.uid=null;S.email=null;S.fotos=null;S.favs=null;S.soFav=false;setMember(null);S.pedido=null;unsubData();unsubPeople();(B.userUnsubs||[]).forEach(x=>{try{x()}catch{}});

      S.uid=u.uid;S.email=u.email;S.authReady=!!store.get('cifras:membro:'+u.uid,null);S.loaded=true;
      watchUser(u);render();

async function exportBackup(){
  const data={app:'cifras-do-ministerio',versao:1,exportadoEm:new Date().toISOString(),songs:Object.fromEntries(S.songs),cultos:Object.fromEntries(S.cultos)};
  const name='cifras-backup-'+todayStr()+'.json';
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Cópia das cifras'});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}
async function importBackup(file){
  let d;try{d=JSON.parse(await file.text())}catch{flash('Esse arquivo não é uma cópia de segurança do app.');return}
  const songs=Object.entries(d.songs||{}),cultos=Object.entries(d.cultos||{});
  if(!songs.length&&!cultos.length){flash('Não encontrei cifras nesse arquivo.');return}
  for(const [id,s] of songs){const x={...s};delete x.apagarCom;await db.setSong(id,x)}
  for(const [id,c] of cultos){const x={...c};delete x.apagarCom;await db.setCulto(id,x)}
  S.sheet=null;flash(`Importei ${songs.length} ${songs.length===1?'cifra':'cifras'} e ${cultos.length} ${cultos.length===1?'culto':'cultos'}.`);
}

function hashStr(t){let h=2166136261;for(const ch of String(t||''))h=Math.imul(h^ch.charCodeAt(0),16777619);return h>>>0}
function capa(s){
  const h=hashStr(s.title),v=h%6,j=(h>>>3)%3;
  const pal=['var(--s1)','var(--s2)','color-mix(in srgb,var(--s1) 55%,var(--s2))','color-mix(in srgb,var(--s2) 70%,#101018)'];
  const bg=pal[[0,1,2,0,3,1][v]],fg=pal[[1,0,1,1,0,0][v]];
  const shapes=[
    `<i style="width:58px;height:58px;right:${-18+j*4}px;top:${-24+j*3}px;background:${fg}"></i>`,
    `<i style="width:44px;height:44px;left:${-14+j*3}px;bottom:${-14+j*2}px;background:${fg}"></i>`,
    `<i style="width:28px;height:28px;right:${6+j*3}px;top:${8+j*2}px;background:${fg}"></i><i style="width:14px;height:14px;right:${30-j*2}px;top:${4+j*3}px;background:${fg};opacity:.6"></i>`,
    `<i style="width:66px;height:26px;border-radius:13px;left:-10px;top:${4+j*3}px;background:${fg}"></i>`,
    `<i style="width:36px;height:36px;right:-10px;bottom:-10px;background:${fg}"></i><i style="width:22px;height:22px;left:4px;top:4px;background:${fg};opacity:.7"></i>`,
    `<i style="width:80px;height:18px;border-radius:0;left:-14px;top:${16+j*4}px;transform:rotate(-35deg);background:${fg}"></i>`][v];
  const ini=String(s.title||'?').trim().split(/\s+/).filter(w=>w.length>1||/^[A-ZÀ-Ú]$/i.test(w)).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'♪';
  return `<span class="capa" aria-hidden="true" style="background:${bg}">${shapes}<b>${esc(ini)}</b></span>`;
}

function ytId(u){const m=/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/.exec(u||'');return m?m[1]:''}
function refKind(u){u=u||'';return ytId(u)?'YouTube':/spotify\.com/.test(u)?'Spotify':/deezer\./.test(u)?'Deezer':/music\.apple\.com/.test(u)?'Apple Music':'Link'}

function placeMini(){const m=document.getElementById('mini');if(!m)return;const v=document.querySelector('.vslot .vv'),bx=document.querySelector('.sheetbox');

  m.style.left=r.left+'px';m.style.top=r.top+'px';m.style.width=r.width+'px';m.style.height=r.height+'px';
  const ct=Math.max(0,b.top-r.top),cb=Math.max(0,r.bottom-b.bottom);

  m.style.clipPath=`inset(${ct}px 0 ${cb}px 0 round 12px)`;m.style.visibility='visible'}

    el.innerHTML=`<div class="sp-top"><span>Velocidade</span><b>${lvl(P.speed)}</b></div><div class="sp-bar"><i style="width:${pct}%"></i><em style="left:${pct}%"></em></div><div class="sp-hint">‹ mais devagar · mais rápido ›</div>`;
    el.classList.add('on');}
  function hide(){const el=$('#speedpop');if(el)el.classList.remove('on')}

/* modelo: cada linha vira {type:'lyric',text,chords:[{pos,ch}]} ou {type:'raw',text} */
function toModel(text){
  const lines=String(text||'').replace(/\t/g,'    ').split(/\r?\n/),out=[];
  for(let i=0;i<lines.length;i++){
    const line=lines[i].replace(/\s+$/,''),c=classify(line);
    if(c.type==='chords'){
      const nx=i+1<lines.length?lines[i+1].replace(/\s+$/,''):null;
      if(nx&&classify(nx).type==='lyric'){
        out.push(mkLyric(nx,[...line.matchAll(/\S+/g)].filter(m=>isChordTok(m[0])).map(m=>({pos:m.index,ch:m[0]}))));i++;continue;
      }
      out.push({type:'raw',text:line});continue;
    }
    if(c.type==='inline'){
      const chords=[];let txt='',last=0;
      for(const m of line.matchAll(/\[([^\]]+)\]/g)){txt+=line.slice(last,m.index);last=m.index+m[0].length;chords.push({pos:txt.length,ch:m[1].trim()})}
      txt+=line.slice(last);out.push(mkLyric(txt,chords));continue;
    }
    if(c.type==='lyric'){out.push(mkLyric(line,[]));continue}
    out.push({type:'raw',text:line});
  }
  return out;
}
function lyricToInline(L){let out='',last=0;for(const c of L.chords){out+=L.text.slice(last,c.pos)+'['+c.ch+']';last=c.pos}return out+L.text.slice(last)}

const loaded={};
function loadScript(src){return loaded[src]||(loaded[src]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('Não consegui carregar o leitor de arquivos. Confira a internet e tente de novo.'));document.head.appendChild(s)}))}
function setStatus(msg,kind){const el=$('#import-status');if(!el)return;el.className='istatus'+(kind?' '+kind:'');el.innerHTML=msg}
function cleanText(t){return t.replace(/\r/g,'').replace(/ /g,' ').replace(/[ \t]+$/gm,'').replace(/\n{3,}/g,'\n\n').replace(/^\n+|\n+$/g,'')}
/* tira cabeçalho (título, artista, "Tom: G") e devolve tudo no formato com acordes na letra */
function textResult(raw){
  let lines=cleanText(raw).split('\n');const res={};
  const ti=lines.findIndex(l=>/^\s*tom\s*:/i.test(l));
  if(ti>=0&&ti<8){
    const m=/tom\s*:\s*([A-G][#b]?m?)/i.exec(lines[ti]);if(m)res.key=m[1][0].toUpperCase()+m[1].slice(1);
    const head=lines.slice(0,ti).filter(l=>l.trim()&&classify(l).type==='lyric');
    if(head.length&&head.length<=3&&lines.slice(0,ti).every(l=>!l.trim()||classify(l).type==='lyric')){res.title=head[0].trim();if(head[1])res.artist=head[1].trim();lines=lines.slice(ti+1)}
    else lines.splice(ti,1);
  }
  const M=toModel(cleanText(lines.join('\n')));
  res.content=cleanText(M.map(L=>L.type==='lyric'?lyricToInline(L):L.text).join('\n'));
  return res;
}
async function readDocx(buf){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');

}
/* posição de cada letra dentro de um trecho, respeitando fontes de largura variável */
let mctx=null;
function charXs(str,w,fam){
  const n=str.length,out=[];
  try{
    if(!mctx) mctx=document.createElement('canvas').getContext('2d');
    mctx.font='100px '+(fam||'sans-serif');
    const ws=[...str].map(c=>mctx.measureText(c).width);const tot=ws.reduce((a,b)=>a+b,0)||1;
    let acc=0;for(let i=0;i<n;i++){out.push(acc*w/tot);acc+=ws[i]||0}
    return out;
  }catch{for(let i=0;i<n;i++)out.push(w*i/n);return out}
}
async function readPdf(buf){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');
  const doc=await window.pdfjsLib.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise;
  const lines=[];let any=false;
  for(let p=1;p<=Math.min(doc.numPages,12);p++){
    const page=await doc.getPage(p);const tc=await page.getTextContent();
    const rows=[];
    for(const it of tc.items){
      if(!it.str) continue; if(it.str.trim()) any=true;
      const x=it.transform[4],y=it.transform[5],h=Math.abs(it.transform[3])||it.height||10;
      let r=rows.find(r=>Math.abs(r.y-y)<Math.min(r.h,h)*0.45);
      if(!r){r={y,h,items:[]};rows.push(r)}
      const st=tc.styles&&tc.styles[it.fontName];r.items.push({x,w:it.width,s:it.str,fam:st&&st.fontFamily||'sans-serif'});
    }
    rows.sort((a,b)=>b.y-a.y);
    let prev=null;
    for(const r of rows){
      if(prev&&prev.y-r.y>Math.max(prev.h,r.h)*2.1) lines.push({text:'',xs:[]});
      r.items.sort((a,b)=>a.x-b.x);
      let text='',xs=[],end=null;
      for(const it of r.items){
        const cw=it.s.length?it.w/it.s.length:5;
        if(end!=null&&it.x-end>cw*0.4&&!text.endsWith(' ')){text+=' ';xs.push(end)}
        const px=charXs(it.s,it.w,it.fam);
        for(let i=0;i<it.s.length;i++){text+=it.s[i];xs.push(it.x+px[i])}
        end=it.x+it.w;
      }
      lines.push({text,xs});prev=r;
    }
    lines.push({text:'',xs:[]});
  }
  if(!any){
    const parts=[];
    for(let p=1;p<=Math.min(doc.numPages,3);p++){
      const page=await doc.getPage(p);const vp=page.getViewport({scale:2});
      const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
      await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      const blob=await new Promise(ok=>c.toBlob(ok,'image/png'));
      const r=await readImage(blob);parts.push(r);
    }
    const first=parts[0]||{};return {...first,content:parts.map(r=>r.content).join('\n\n')};
  }
  return textResult(geoToText(lines));
}
/* linhas com a posição horizontal de cada letra -> cifra com o acorde na sílaba certa */
function geoToText(lines){
  const out=[];
  for(let i=0;i<lines.length;i++){
    const L=lines[i],t=L.text.replace(/\s+$/,'');
    if(isChordLine(t)){
      const N=lines[i+1];
      if(N&&N.text.trim()&&classify(N.text.replace(/\s+$/,'')).type==='lyric'){
        const ins=[],n=N.xs.length;
        const cw=n>1?(N.xs[n-1]-N.xs[0])/(n-1):8;
        for(const m of t.matchAll(/\S+/g)){
          if(!isChordTok(m[0])) continue;
          const cx=L.xs[m.index];let best=N.text.length,bd=Infinity;
          N.xs.forEach((x,k)=>{if(N.text[k]===' ')return;const d=Math.abs(x-cx);if(d<bd){bd=d;best=k}});
          if(cx>N.xs[n-1]+cw*1.5) best=N.text.length;
          ins.push({pos:best,ch:m[0]});
        }
        out.push(lyricToInline(mkLyric(N.text.replace(/\s+$/,''),ins)));i++;continue;
      }
      out.push(t.trim().split(/\s+/).join('  '));continue;
    }
    out.push(t.trim()?t.replace(/^\s+/,''):'');
  }
  return out.join('\n');
}
/* ===== Foto ou print: leitura de texto no próprio aparelho (Tesseract) ===== */
function fixChordTok(t){
  let x=t.replace(/\?/g,'7').replace(/[|\[\]{}]/g,'').replace(/^\(+/,'');
  if(isChordTok(x)) return x;
  for(let k=x.length-1;k>=1;k--){if(isChordTok(x.slice(0,k))) return x.slice(0,k)}
  return null;
}
/* linha com quase só acordes: limpa os erros comuns da leitura (ex.: "Cc" -> "C", "Dm?" -> "Dm7") */
function cleanOcrWords(ws){
  const fx=ws.map(w=>w.text.length<=8?fixChordTok(w.text):null);
  const ok=fx.filter(Boolean).length;
  if(ok&&ok/ws.length>=0.6) return ws.map((w,i)=>fx[i]?{...w,text:fx[i]}:null).filter(Boolean);
  return ws;
}
function wordsToLine(ws){
  let text='',xs=[];
  ws.forEach((w,i)=>{
    if(i){text+=' ';xs.push(ws[i-1].x1)}
    const n=w.text.length,step=n?(w.x1-w.x0)/n:0;
    for(let k=0;k<n;k++){text+=w.text[k];xs.push(w.x0+step*k)}
  });
  return {text,xs};
}
/* agrupa as linhas lidas e põe linha em branco onde há espaço grande entre elas */
function ocrLinesToGeo(rows){
  const hs=rows.map(r=>r.y1-r.y0).sort((a,b)=>a-b);const lh=hs[Math.floor(hs.length/2)]||20;
  const out=[];let prev=null;
  for(const r of rows){
    if(prev&&r.y0-prev.y1>lh*1.35) out.push({text:'',xs:[]});
    out.push(wordsToLine(cleanOcrWords(r.words)));prev=r;
  }
  return out;
}
async function prepImage(file){
  const bmp=await createImageBitmap(file);
  let k=Math.min(2,2600/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(bmp,0,0,c.width,c.height);
  const im=g.getImageData(0,0,c.width,c.height),d=im.data,n=d.length/4;
  const lum=new Uint8Array(n);let sum=0;
  for(let i=0;i<n;i++){const v=(d[i*4]*299+d[i*4+1]*587+d[i*4+2]*114)/1000;lum[i]=v;sum+=v}
  const dark=sum/n<128;
  const hist=new Uint32Array(256);for(let i=0;i<n;i++){const v=dark?255-lum[i]:lum[i];lum[i]=v;hist[v]++}
  let lo=0,hi=255,acc=0;for(;lo<255;lo++){acc+=hist[lo];if(acc>n*0.01)break}
  acc=0;for(;hi>0;hi--){acc+=hist[hi];if(acc>n*0.01)break}
  const span=Math.max(1,hi-lo),th=160;
  for(let i=0;i<n;i++){const v=Math.max(0,Math.min(255,(lum[i]-lo)*255/span));const b=v>th?255:0;d[i*4]=d[i*4+1]=d[i*4+2]=b;d[i*4+3]=255}
  g.putImageData(im,0,0);
  return c;
}
async function readImage(file){
  setStatus('<span class="spin"></span> Preparando a imagem…');
  await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  const canvas=await prepImage(file);
  setStatus('<span class="spin"></span> Lendo a imagem. Na primeira vez o leitor é baixado (uns 10 MB) e demora um pouco mais…');
  const worker=await window.Tesseract.createWorker('por',1,{logger:m=>{if(m.status==='recognizing text'&&m.progress)setStatus('<span class="spin"></span> Lendo a imagem… '+Math.round(m.progress*100)+'%')}});
  let data;
  try{await worker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});data=(await worker.recognize(canvas)).data}
  finally{worker.terminate().catch(()=>{})}
  let rows=[];
  const box=w=>({text:String(w.text||'').trim(),x0:w.bbox.x0,x1:w.bbox.x1,y0:w.bbox.y0,y1:w.bbox.y1});
  if(data.lines&&data.lines.length&&data.lines[0].words){
    rows=data.lines.map(L=>{const words=L.words.map(box).filter(w=>w.text);return {y0:L.bbox.y0,y1:L.bbox.y1,words}}).filter(r=>r.words.length);
  }else if(data.words&&data.words.length){
    for(const w of data.words.map(box).filter(w=>w.text)){
      const r=rows.find(r=>Math.abs((r.y0+r.y1)/2-(w.y0+w.y1)/2)<(w.y1-w.y0)*0.6);
      if(r){r.words.push(w);r.y0=Math.min(r.y0,w.y0);r.y1=Math.max(r.y1,w.y1)}else rows.push({y0:w.y0,y1:w.y1,words:[w]});
    }
    rows.forEach(r=>r.words.sort((a,b)=>a.x0-b.x0));rows.sort((a,b)=>a.y0-b.y0);
  }else if(data.text&&data.text.trim()) return textResult(data.text);
  if(!rows.length) throw new Error('Não encontrei texto nessa imagem. Tente um print mais nítido, ou copie e cole o texto.');
  return textResult(geoToText(ocrLinesToGeo(rows)));
}
async function importFile(f,auto){
  setStatus('<span class="spin"></span> Lendo '+esc(f.name)+'…');
  try{
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    let res;
    if((f.type||'').startsWith('image/')||['jpg','jpeg','png','heic','heif','webp'].includes(ext)) res=await readImage(f);
    else if(ext==='pdf'||f.type==='application/pdf') res=await readPdf(await f.arrayBuffer());
    else if(ext==='docx') res=textResult(await readDocx(await f.arrayBuffer()));
    else if(ext==='doc'||ext==='pages') throw new Error('Esse formato não dá para ler. Abra o arquivo e salve como PDF ou .docx, ou copie e cole o texto abaixo.');
    else res=textResult(await f.text());
    if(!res.content||!res.content.trim()) throw new Error('Não encontrei texto nesse arquivo. Tente outro arquivo ou cole a cifra abaixo.');
    if(S.view!=='edit') return;
    const name=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim();
    if(!$('#f-title').value.trim()) $('#f-title').value=res.title||name;
    if(res.artist&&!$('#f-artist').value.trim()) $('#f-artist').value=res.artist;
    if(res.key){const k=parseKey(res.key);$('#f-root').value=String(k.idx);$('#f-minor').value=k.minor?'m':''}
    $('#content').value=res.content;
    switchTab('acordes');
    const fromImg=(f.type||'').startsWith('image/')||['jpg','jpeg','png','heic','heif','webp'].includes(ext);
    setStatus(fromImg?'Pronto! Confira abaixo: apague em <b>Letra</b> o que não for da música (hora, botões, título do site) e corrija algum acorde tocando na palavra. Depois salve.':'Pronto! Confira os acordes abaixo. Se algum estiver fora do lugar, toque na palavra para corrigir, depois salve.','ok');
    saveDraft();
    const ph=$('#pane-acordes');if(ph) ph.scrollIntoView({block:'start'});
  }catch(e){setStatus(esc(e.message||'Não consegui ler esse arquivo. Cole a cifra no campo abaixo.'),'err')}
}

/* ================= Rolagem automática ================= */
function stopScroll(){scrollState.on=false;cancelAnimationFrame(scrollState.raf)}
function tick(t){
  if(!scrollState.on) return;
  const dt=scrollState.last?(t-scrollState.last)/1000:0;scrollState.last=t;
  scrollState.acc+=P.speed*dt;
  const px=Math.floor(scrollState.acc);
  const el=$('.sheetbox');if(!el){stopScroll();return}
  if(px>=1){scrollState.acc-=px;el.scrollTop+=px}
  if(el.scrollTop+el.clientHeight>=el.scrollHeight-2){stopScroll();renderBottom();return}
  scrollState.raf=requestAnimationFrame(tick);
}

document.addEventListener('keydown',e=>{
  if(S.view!=='edit'||S.etab!=='acordes'||S.sheet||e.ctrlKey||e.metaKey||e.altKey)return;
  const t=e.target,typing=t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable);if(typing)return;
  const k=e.key;
  if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();if(!S.selW)nextLine(0);else nextWord(k==='ArrowLeft'?-1:1);return}
  if(k==='ArrowUp'||k==='ArrowDown'){e.preventDefault();if(!S.selW)nextLine(0);else nextLine(k==='ArrowUp'?-1:1);return}
  if(k==='z'||k==='Z'){e.preventDefault();undoPlacer();return}
  if(!S.selW)return;
  if(/^[1-7]$/.test(k)){const b=document.querySelectorAll('.pick .palette [data-chord]')[+k-1];if(b){e.preventDefault();setChordAtSel(b.dataset.chord)}return}
  if(k==='Delete'||k==='Backspace'){e.preventDefault();removeChordAtSel();return}
  if(/^[a-gA-G]$/.test(k)){const o=$('#pk-other');if(o){e.preventDefault();o.value=k.toUpperCase();o.focus();o.setSelectionRange(1,1)}return}
});
